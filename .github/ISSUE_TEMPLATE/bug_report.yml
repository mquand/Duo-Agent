name: Bug Report
description: File a bug report to help us improve Duo-Agent
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please check if the issue has already been reported before submitting.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened unexpectedly...
    validations:
      required: true

  - type: dropdown
    id: execution-mode
    attributes:
      label: Execution Mode
      description: Which Duo-Agent mode were you running?
      options:
        - Interactive REPL Shell (`duo`)
        - One-shot Command (`duo "prompt"`)
        - Plan-Only Mode (`duo -p "prompt"`)
        - Worktree Parallel Mode (`duo --worktree`)
        - Rollback (`duo --undo`)
        - Other / Subcommand
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior.
      placeholder: |
        1. Run `duo`
        2. Enter prompt '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: diagnostic
    attributes:
      label: System & Diagnostic Output
      description: Run `node bin/duo.js doctor` or `duo doctor` and paste the output here, along with your OS and Node version.
      placeholder: |
        - OS: macOS / Linux / Windows
        - Node Version: v20.x.x
        - Duo Doctor output:
      render: shell
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Error Output
      description: Paste relevant terminal logs or error traces. Please redact any sensitive tokens or API keys!
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have verified this bug on the latest `main` branch.
          required: true
        - label: I have ensured no API keys, secrets, or sensitive credentials are included in this report.
          required: true
